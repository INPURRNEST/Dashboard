<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IoT Monitoring</title>

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(-45deg, #1e1e2f, #2c2c3e, #1e1e2f, #3a3a5a);
    background-size: 400% 400%;
    animation: gradientBG 12s ease infinite;
    color: white;
    text-align: center;
    padding-top: 40px;
}

@keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.container {
    display: flex;
    justify-content: center;
    gap: 40px;
    align-items: flex-start;
}

.left-column {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.card {
    backdrop-filter: blur(12px);
    background: rgba(255, 255, 255, 0.08);
    padding: 25px;
    border-radius: 20px;
    width: 320px;
    box-shadow: 0 0 25px rgba(0,0,0,0.6);
}

.small-card {
    width: 260px;
    padding: 15px;
    font-size: 14px;
}

.mq-row {
    display: flex;
    align-items: center;
    gap: 15px;
}

.control-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
}

button {
    padding: 10px 20px;
    border: none;
    border-radius: 10px;
    background: #4da6ff;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #3399ff;
}

.led {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #1e3a5f;
    box-shadow: 0 0 5px #1e3a5f;
    transition: all 0.3s ease;
}

.led.on {
    background: #00aaff;
    box-shadow: 0 0 15px #00aaff, 0 0 30px #00aaff;
}

h2 {
    margin-bottom: 15px;
}

.data {
    font-size: 20px;
    margin: 10px 0;
    font-weight: bold;
}
</style>
</head>

<body>

<h1>🌡️ IN-PURRNEST SHELTER IoT Monitoring</h1>

<div class="container">

    <div class="left-column">

        <div class="card">
            <h2>Room 1</h2>
            <div id="temp1" class="data">Temp: Loading...</div>
            <div id="water1" class="data">Water: Loading...</div>
            <div id="food1" class="data">Food: Loading...</div>
        </div>

        <!-- MQ + BUTTON + LED -->
        <div class="mq-row">

            <div class="card small-card">
                <h2>MQ137 Sensor</h2>
                <div id="mq137" class="data">NH₃: Loading...</div>
            </div>

            <div class="control-panel">
                <button id="btnV6">Toggle</button>
                <div id="ledV10" class="led"></div>
            </div>

        </div>

    </div>

    <div class="card">
        <h2>Room 2</h2>
        <div id="temp2" class="data">Temp: Loading...</div>
        <div id="water2" class="data">Water: Loading...</div>
        <div id="food2" class="data">Food: Loading...</div>
    </div>

</div>

<script>

const BASE_URL = "https://dashboard-ua9o.onrender.com";

let ledState = 0;

// FETCH DATA
async function loadData() {
    try {
        const res = await fetch(`${BASE_URL}/api/data`);
        const data = await res.json();

        // ROOM 1
        document.getElementById("temp1").innerText =
            `Temp: ${data.room1.temp} °C`;

        document.getElementById("water1").innerText =
            `Water: ${data.room1.water} %`;

        document.getElementById("food1").innerText =
            `Food: ${data.room1.food == 1 ? "HIGH" : "LOW"}`;

        // ROOM 2
        document.getElementById("temp2").innerText =
            `Temp: ${data.room2.temp} °C`;

        document.getElementById("water2").innerText =
            `Water: ${data.room2.water} %`;

        document.getElementById("food2").innerText =
            `Food: ${data.room2.food == 1 ? "HIGH" : "LOW"}`;

        // MQ137
        document.getElementById("mq137").innerText =
            `NH₃: ${data.mq137} ppm`;

        // LED STATE
        updateLED(data.v10);

    } catch (err) {
        console.log("Waiting for server...");
    }
}

// BUTTON → NOW CALLS BACKEND (TOKEN HIDDEN)
document.getElementById("btnV6").addEventListener("click", async () => {
    try {
        ledState = ledState === 1 ? 0 : 1;

        await fetch(`${BASE_URL}/api/toggleV6?value=${ledState}`);

        updateLED(ledState);

    } catch (err) {
        console.log("Button error:", err);
    }
});

// LED VISUAL
function updateLED(value) {
    const led = document.getElementById("ledV10");

    if (value == 1) {
        led.classList.add("on");
    } else {
        led.classList.remove("on");
    }
}

// AUTO REFRESH
setInterval(loadData, 3000);
loadData();

</script>

</body>
</html>
