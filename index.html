<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IoT Monitoring</title>

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(-45deg, #1e1e2f, #2c2c3e, #1e1e2f, #3a3a5a);
    background-size: 400% 400%;
    animation: gradientBG 12s ease infinite;
    color: white;
    text-align: center;
    padding-top: 40px;
}

@keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.container {
    display: flex;
    justify-content: center;
    gap: 40px;
    align-items: flex-start;
}

.left-column {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.card {
    backdrop-filter: blur(12px);
    background: rgba(255, 255, 255, 0.08);
    padding: 25px;
    border-radius: 20px;
    width: 320px;
    box-shadow: 0 0 25px rgba(0,0,0,0.6);
    transition: transform 0.3s ease;
}

.card:hover {
    transform: scale(1.05);
}

.small-card {
    width: 260px;
    padding: 15px;
    font-size: 14px;
}

h2 {
    margin-bottom: 15px;
}

.data {
    font-size: 20px;
    margin: 10px 0;
    font-weight: bold;
}

.temp-high { color: #ff6b6b; }
.temp-normal { color: #4cd137; }
.offline { color: #ffcc00; }
</style>
</head>

<body>

<h1>🌡️ IN-PURRNEST SHELTER IoT Monitoring</h1>

<div class="container">

    <div class="left-column">

        <div class="card">
            <h2>Room 1</h2>
            <div id="temp1" class="data">Temp: Loading...</div>
            <div id="water1" class="data">Water: Loading...</div>
            <div id="food1" class="data">Food: Loading...</div>
        </div>

        <div class="card small-card">
            <h2>MQ137 Sensor</h2>
            <div id="mq137" class="data">NH₃: Loading...</div>
        </div>

    </div>

    <div class="card">
        <h2>Room 2</h2>
        <div id="temp2" class="data">Temp: Loading...</div>
        <div id="water2" class="data">Water: Loading...</div>
        <div id="food2" class="data">Food: Loading...</div>
    </div>

</div>

<script>

const BASE_URL = "https://dashboard-zuge.onrender.com/api/data";

// SAFE FETCH (prevents freeze)
async function safeFetch(url) {
    try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("Server error");
        return await res.json();
    } catch (err) {
        console.log("Fetch failed:", url);
        return null;
    }
}

// ROOM 1
async function loadRoom1() {
    const data = await safeFetch(`${BASE_URL}/api/room1`);

    if (!data) {
        document.getElementById("temp1").innerHTML = `<span class="offline">OFFLINE</span>`;
        document.getElementById("water1").innerHTML = `<span class="offline">OFFLINE</span>`;
        document.getElementById("food1").innerHTML = `<span class="offline">OFFLINE</span>`;
        document.getElementById("mq137").innerHTML = `<span class="offline">OFFLINE</span>`;
        return;
    }

    const temp = parseFloat(data.temp) || 0;
    const tempClass = temp > 40 ? "temp-high" : "temp-normal";

    document.getElementById("temp1").innerHTML =
        `Temp: <span class="${tempClass}">${temp} °C</span>`;

    document.getElementById("water1").innerText =
        `Water: ${data.water ?? "N/A"} %`;

    document.getElementById("food1").innerText =
        `Food: ${data.food == 1 ? "HIGH" : "LOW"}`;

    document.getElementById("mq137").innerText =
        `NH₃: ${data.mq137 ?? "N/A"} ppm`;
}

// ROOM 2
async function loadRoom2() {
    const data = await safeFetch(`${BASE_URL}/api/room2`);

    if (!data) {
        document.getElementById("temp2").innerHTML = `<span class="offline">OFFLINE</span>`;
        document.getElementById("water2").innerHTML = `<span class="offline">OFFLINE</span>`;
        document.getElementById("food2").innerHTML = `<span class="offline">OFFLINE</span>`;
        return;
    }

    const temp = parseFloat(data.temp) || 0;
    const tempClass = temp > 40 ? "temp-high" : "temp-normal";

    document.getElementById("temp2").innerHTML =
        `Temp: <span class="${tempClass}">${temp} °C</span>`;

    document.getElementById("water2").innerText =
        `Water: ${data.water ?? "N/A"} %`;

    document.getElementById("food2").innerText =
        `Food: ${data.food == 1 ? "HIGH" : "LOW"}`;
}

// AUTO REFRESH (kept 3 seconds)
setInterval(() => {
    loadRoom1();
    loadRoom2();
}, 3000);

loadRoom1();
loadRoom2();

</script>

</body>
</html>
